[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-insurance-agent"
version = "0.1.0"
description = "Runnable LangGraph insurance claims workflow demo"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
llm = ["langchain-openai>=0.2.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["insurance_agent*", "insurance_mid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
